[project]
name = "econ-management-meta-skill"
version = "0.1.0"
description = "Fail-closed architecture prototype for economics and management meta-analysis workflows"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "jsonschema>=4.23"]

[project.scripts]
emm = "econ_management_meta.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/econ_management_meta"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
